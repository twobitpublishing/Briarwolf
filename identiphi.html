<!DOCTYPE html>
<html lang="en">
<head>
<link href='https://fonts.googleapis.com/css?family=Newsreader' rel='stylesheet'>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keyword Responses</title>
<style>

  /* ====================================================================
     EDIT ME — your keywords and responses.
     Keys are matched case-insensitively and with extra spaces trimmed,
     so "Hello", " hello ", and "HELLO" all match the "hello" entry.
     Add or remove as many lines as you like.
  ==================================================================== */

  :root{
    --paper:#504030;
    --ink:#221f26;
    --muted:#6b6570;
    --line:#e5e0db;
    --accent:#504030;
    --radius:8px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100%;overflow-x:hidden}
  body{
    font:200 20px/1 'Charm';
    color:var(--ink);
    background-color:var(--paper);
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:48px 24px 24px;
  }

    .card{
    width:100%;
    max-width:480px;
    background:rgba(250,248,245,0.96);
    border:1px solid var(--line);
    border-radius:12px;
    padding:28px 26px 24px;
    box-shadow:0 10px 30px rgba(0,0,0,0.12);
  }

  .card-image{
    display:block;
    max-width:300px;
    width:100%;
    height:auto;
    margin:0 auto 16px;
  }
  .card-image[hidden]{display:none}

  h1{
    margin:0 0 4px;
    font-size:24px;
    font-weight:600;
  }
  .sub{
    margin:0 0 5px;
    font-size:0px;
    color:var(--muted);
  }

  form{display:flex;gap:8px}
  #keyword{
    flex:1;
    min-width:0;
    padding:11px 13px;
    font:inherit;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:#fff;
  }
  #keyword:focus,button:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }
  button{
    font:500 15px/1 inherit;
    padding:11px 18px;
    border:0;
    border-radius:var(--radius);
    background:var(--accent);
    color:#fff;
    cursor:pointer;
  }
  button:hover{opacity:0.92}

  .response{
  margin-top:18px;
  padding:14px 16px;
  border-radius:var(--radius);
  border:1px solid var(--line);
  background:#fff;
  min-height:1.4em;
  display:none;
  white-space: pre-line;
}
  .response.show{display:block}
  .response.miss{color:var(--muted);font-style:italic}
</style>
</head>
<body>

<div class="card">
  <img id="cardImage" class="card-image" alt="" hidden>
  <h5>Welcome Back! Verify your first name.</h5>
  <p class="sub">Welcome Back! Verify your first name and press Enter.</p>

  <form id="form">
    <input id="keyword" type="text" autocomplete="off" placeholder="Type a keyword…" aria-label="Keyword">
    <button type="submit">Go</button>
  </form>

  <p class="response" id="response" role="status" aria-live="polite"></p>
</div>

<script>

    "onyx": "<b>Hello, Onyx Glass,\n\n<b>Last Entry:</b> I'm hoping I can put some of this guilt behind me. I actually found Vladimir Rimidalv because of an anonymous tip from someone communicating through a mist call. When I used aura tracing magic to track it, the call was coming from Miguel De Mago's house.\n\nI left out the mist call tip and took credit for locating him myself. The Captain was so impressed that he assigned me as the lead aura locator on this case.\n\n<b>Entry From This Morning:</b> Something strange on this case was that Professor Prinetto was really difficult to find. For a minute, it looked like I could see them in two places at once.\n\nRecently Updated Hex-Key Password: <b>Gaze</b>",
    "blee": "<b>Hello, Blee Oyardy,\n\n<b>Recent Entries:</b>\n<b>href=\"https://criminology.twobitpublishing.com/identiphi.html?k=dad\" target=\"_blank\" rel=\"noopener\">Dad</a>\nType <b>'Barkberries'</b> for this morning's entry.\n\nRecently Updated Hex-Key Password: <b>Conjure</b>",
    "dad": "<b>Hello, Blee Oyardy,\n\n<b>Yesterday's Entry:</b> I have been thinking a lot about Dad since he passed away. I knew that he'd always been ashamed of me, even in my success. He couldn't ever forgive me for being born without any magical abilities, despite coming from two very renowned bloodlines.\n\nHe's the one who gave me my wand for my 11th birthday after he used it to light the candles. I just carry it for show now. Still, he never revealed my secret even as I built a reputation as a world-class potionmaster. I'd always been good with recipes, and people didn't suspect that I couldn't do the final enchantment on my own potions. Especially when I claimed that shipping finalized potions was dangerous, and the buyer would have to do the enchantment for safety reasons.\n\nFor this morning's entrym Type <b>'barkberries'</b> in the space above.\n\nRecently Updated Hex-Key Password: <b>Conjure</b>",
    "barkberries": "<b>Hello, Blee Oyardy,\n\n<b>Today's Entry:</b>I am still being blackmailed by an unknown person about my lack of powers, and still have not heard back from Borlook, that half-goblin detective I hired to find him. Today, I was coming back from buying barkberries at the store when authorities came to bring me to some safehouse. I still have them with me. I'll have to be careful not to smash them, or they'll stain my pocket. Barkberries are not a magical ingredient, but they do mask the smell and taste of my ingredients to keep my original potion recipes secret.\n\nRecently Updated Hex-Key Password: <b>Conjure</b>",
    "pat": "<b>Access Denied, Aura Scan Unable to Confirm Identity",
    "borlook": "<b>Hello, Detective Borlook,\n\n<b>Latest Entry:</b> Reminder to renew my derecognition licence as soon as inhumanly possible. Look-alike potions last much longer on goblinfolk than humans, so the fines are going to be much more severe if I get caught. With that in mind, I also need to remember to apply the icetree bark extract in my pocket at least every hour behind the ears, or someone will notice my goblin scent. My disguise will wear off around 6 a.m. tomorrow.\n\n To See Previous Entries, type 'Prinetto Case' or 'Oyardy Case'\n\nRecently Updated Hex-Key Password: <b>Sleuth</b>",
    "prinetto case": "<b>Hello, Detective Borlook,\n\n<b>Prinetto Case Notes:</b> Pat Prinetto came to me with a few suspicions about things at Briarwolf. I went there undercover and subtly questioned a few of the school staff with a lie-detecting spell. Briarwolf’s Principal, Jenifer Porter, seemed really worried about something, but didn't offer anything up. I knew Jenifer during my time at Briarwolf, when I was among the first non-human students to attend. She advocated for the inclusion of non-humans with magical powers into the school and was very welcoming to me. This morning, I found some burnt remnants of Dragonscale Insurance letterhead in her trash. Other than that, I haven’t covered much ground in my investigation before being summoned to this safehouse.\n\nTo See Another Previous Entry, Type 'Oyardy Case'.\n\nRecently Updated Hex-Key Password: <b>Sleuth</b>",  
    "viclan": "<b>Hello, Viclan Wahl,\n\n<b>Latest Entry:</b> Thank you for signing in. \n\n<b>Recently Updated Hex-Key Password:</b> Shackle",
    "taylor": "<b>Hello, Taylor Slapdash,\n\n<b>Latest Entry:</b> Thank you for signing in. \n\n<b>Recently Updated Hex-Key Password:</b> Shackle",
    "franky": "<b>Hello, Franky Fontana,\n\n<b>Latest Entry:</b> Thank you for signing in. \n\n<b>Recently Updated Hex-Key Password:</b> Shackle",
    "wimbly": "<b>Hello, Wimbly Wickersham,\n\n<b>Latest Entry:</b> Thank you for signing in. \n\n<b>Recently Updated Hex-Key Password:</b> Shackle",
    "blake": "<b>Hello, Blake Divine,\n\n<b>Latest Entry:</b> Thank you for signing in.\n\n<b>Recently Updated Hex-Key Password:</b> Shackle",
    "phoenix": "<b>Hello, Phoenix Phangly,\n\n<b>Latest Entry:</b> Thank you for signing in.\n\n<b>Recently Updated Hex-Key Password:</b> Shackle",
    "alex": "<b>Hello, Alex Basset,\n\n<b>Latest Entry:</b> Thank you for signing in.\n\n<b>Recently Updated Hex-Key Password:</b> Shackle",
    "arbor": "<b>Hello, Arbor Thorne,\n\n<b>Latest Entry:</b> Thank you for signing in.\n\n<b>Recently Updated Hex-Key Password:</b> Shackle",
    "scout": "<b>Hello, Scout Scrivener,\n\n<b>Latest Entry:</b> Thank you for signing in.\n\n<b>Recently Updated Hex-Key Password:</b> Shackle",
    "help": "Please sign in with your name to receive some much-needed information.",
    "nox": "I cannot see. It is too dark in here.",
    "lumos": "Could you please put out that light? It is much too bright.",
    "expelliarmus": "I cannot reply right now. I've dropped my wand.",
    "accio": "I am literally right here!",
    "alohamora": "You can't unlock my secrets that easily.",
    "expecto patronum": "Wow, what a lovely luminescent creature.",
    "obliviate": "I'm sorry, what were we talking about?",
    "stupefy": "I cannot believe you would do that to me. I am stunned.",
    "wingardium leviosa": "I feel light as a feather.",
    "avada kedavra": "I cannot believe you would do that to me. That is unforgivable.",
    "crucio": "Ahhhhh!!! The pain!!! Stop it!!! I'm just messing with you. I can't feel a thing. I'm just a hexed bit of code.",
    "imperio": "You now have a bodyless minion to do your bidding. Happy?",
    "riddikulus": "Why did the wizard go to Briarwolf?\nTo learn how to SPELL.",
    "salutem sileo": "Salutem Sileo is a premium spell for an instant cure from pixie pox, the blue plague, dragon sneezes, bouts of weightlessness, poison, unwanted love spells, and more.\nCharges will apply upon casting.\nCurrent price is Φ10.00 or .17 Wizcoin.",
    "nine broom": "Nine Broom is a sport in which two teams of nine try to score on the opponent’s three by three grid of goals.",
    "whisps": "Whisps are thirty-second shareable illusions.",
    "whisp": "Whisps are thirty-second shareable illusions.",
    "n.m.": "NM is a slang term for nonmagic humans, or humans that do not know about the existence of wizards and witches. Also known by younger generations as an NPC.",
    "NM": "NM is a slang term for nonmagic humans, or humans that do not know about the existence of wizards and witches. Also known by younger generations as an NPC.",
    "NPC": "NPC is a slang term for nonmagic humans, or humans that do not know about the existence of wizards and witches. Also known as an NM."
  };
  // Set this to the filename of an image you've added to this same GitHub
  // repo (e.g. "background.jpg") to give every visitor the same background
  // by default. Leave it "" for no default background.
  var DEFAULT_BACKGROUND = "";

  // Set this to the filename of a PNG you've added to this same GitHub repo
  // (e.g. "logo.png") to show it inside the card, above the heading.
  // Leave it "" to show no image.
  var CARD_IMAGE = "identiphi.png";

  // --------------------------------------------------------------------

  var els = {
    form:     document.getElementById('form'),
    keyword:  document.getElementById('keyword'),
    response: document.getElementById('response'),
    cardImage:document.getElementById('cardImage')
  };

  function norm(s) {
    return String(s || '').trim().toLowerCase();
  }

  function showResponse(text, missed) {
    els.response.innerHTML = text;
    els.response.className = 'response show' + (missed ? ' miss' : '');
  }

  function lookup(raw) {
    var key = norm(raw);
    if (!key) return;
    if (Object.prototype.hasOwnProperty.call(RESPONSES, key)) {
      showResponse(RESPONSES[key], false);
    } else {
      var known = Object.keys(RESPONSES).join(', ');
      showResponse('No response for "' + raw.trim() + '".');
    }
  }

  els.form.addEventListener('submit', function (e) {
    e.preventDefault();
    lookup(els.keyword.value);
  });

  // ---- background image ----

  if (DEFAULT_BACKGROUND) {
    document.body.style.backgroundImage = 'url(' + JSON.stringify(DEFAULT_BACKGROUND).slice(1, -1) + ')';
  }

  // ---- card image ----

  if (CARD_IMAGE) {
    els.cardImage.src = CARD_IMAGE;
    els.cardImage.hidden = false;
  }

  // ---- pre-fill from a link ----
  // A link like identiphi.html?k=onyx will type "onyx" into the box and
  // show its response automatically when the page loads.
  var preset = new URLSearchParams(window.location.search).get('k');
  if (preset) {
    els.keyword.value = preset;
    lookup(preset);
  }

  els.keyword.focus();
})();
</script>
</body>
</html>
