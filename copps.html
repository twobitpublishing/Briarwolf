<!DOCTYPE html>
<html lang="en">
<head>
<link href='https://fonts.googleapis.com/css?family=archivo black' rel='stylesheet'>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keyword Responses</title>
<style>

  /* ====================================================================
     EDIT ME — your keywords and responses.
     Keys are matched case-insensitively and with extra spaces trimmed,
     so "Hello", " hello ", and "HELLO" all match the "hello" entry.
     Add or remove as many lines as you like.
  ==================================================================== */

  :root{
    --paper:#ceccc9;
    --ink:#221f26;
    --muted:#6b6570;
    --line:#e5e0db;
    --accent:#000000;
    --radius:8px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100%}
  body{
    font:200 20px/1.55 'Charm';
    color:var(--ink);
    background-color:var(--paper);
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:48px 24px 24px;
  }

    .card{
    width:100%;
    max-width:480px;
    background:rgba(165,164,201,1);
    border:1px solid var(--line);
    border-radius:12px;
    padding:28px 26px 24px;
    box-shadow:0 10px 30px rgba(0,0,0,0.12);
  }

  .card-image{
    display:block;
    max-width:300px;
    width:100%;
    height:auto;
    margin:0 auto 16px;
  }
  .card-image[hidden]{display:none}

  h1{
    margin:0 0 4px;
    font-size:24px;
    font-weight:600;
  }
  .sub{
    margin:0 0 5px;
    font-size:0px;
    color:var(--muted);
  }

  form{display:flex;gap:8px}
  #keyword{
    flex:1;
    padding:11px 13px;
    font:inherit;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:#fff;
  }
  #keyword:focus,button:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }
  button{
    font:500 15px/1 inherit;
    padding:11px 18px;
    border:0;
    border-radius:var(--radius);
    background:var(--accent);
    color:#fff;
    cursor:pointer;
  }
  button:hover{opacity:0.92}

  .response{
  margin-top:18px;
  padding:14px 16px;
  border-radius:var(--radius);
  border:1px solid var(--line);
  background:#fff;
  min-height:1.4em;
  display:none;
  white-space: pre-line;
}
  .response.show{display:block}
  .response.miss{color:var(--muted);font-style:italic}
</style>
</head>
<body>

<div class="card">
  <img id="cardImage" class="card-image" alt="" hidden>
  <h1>Enter Password</h1>
  <p class="sub">Type a keyword and press Enter.</p>

  <form id="form">
    <input id="keyword" type="text" autocomplete="off" placeholder="Type a keyword…" aria-label="Keyword">
    <button type="submit">Go</button>
  </form>

  <p class="response" id="response" role="status" aria-live="polite"></p>
</div>

<script>
(function () {
  "use strict";

  // ====================================================================
  // EDIT ME — add, remove, or change keywords and their responses here.
  // ====================================================================
  var RESPONSES = {
    "shackle":  "Hello, Detective Critterson,\nYou served in the same coven as Pat Prinetto in the battle of Rocky Mountain and became good friends. ",
    "gaze":   "Hello, Onyx Glass,\nYou have a current location on Vladimir Rimidalv. It looks like he’s headed to this side of town. Through your crystal ball, you see a faint aura in the room. The kind of aura, goblins normally have, but not as strong.",
    "conjure":  "Hello, Blee Oyardy,\nYou still haven’t heard back from Blake Divine. This would be a great opportunity to see if you could sponsor some of their future whisps.",
    "sleuth": "Hello, Detective Borlook,\nYou don’t recognize Franky Fontana, but the name rings a bell, and you can’t figure out why. You have met Blee Oyardy before, but they obviously wouldn’t recognize you currently. They hired you to find someone who was blackmailing them, but you were nearly caught snooping around and haven’t been able to get back on that case.",
    "soldier": "Hello, Professor Pat Prinetto,\nEmergency Protocol in place. Postmortem Lockdown Hex initiated. Access Denied.",
    "score": "Hello, Viclan Wahl,\nProfessor Prinetto was your tactical spells teacher when you attended school, and was one of your favorites.",
    "wrangle": "Hello, Taylor Slapdash,\nYour fangtail is missing from your pocket. You must find it before Detective Critterson does. Hopefully, there are no barkberries around.",
    "goon": "Hello, Franky Fontana,\nProfessor Prinetto was abducted a few days ago and was supposed to have been killed by Vladimir Rimidalv this morning.",
    "duty": "Hello, Wimbly Wickersham,\nViclan Wahl is a famous nine broom player, who recently donated a large amount to your campaign.",
    "spotlight": "Hello, Blake Divine,\nYou knew Phoenix Phangly in high school. They kept to themselves and never went to sporting events, dances, or other after-school events.",
    "howl": "Hello, Phoenix Phangly,\nYou knew Blake Divine in high school. It’s surprising to see how little they aged.",
    "track": "Hello, Alex Basset,\nYou have seen Franky Fontana before in pictures with Vladimir Rimidalv.",
    "mulch": "Hello, Arbor Thorne,\nYou smell barkberries, a nonmagical fruit with a strong taste. You grew a barkberry bush in the school greenhouse once, but it attracted some fangtails who got in and stole the berries off of it. Their acid burned holes through one of the walls and several of the tables, making them dangerous and illegal to own.",
    "scoop": "Hello, Scout Scrivener,\nYou have met Franky Fontana at Dragonscale Insurance, but you were wearing a disguise at the time, so he shouldn’t recognize you.",
    "help": "Please provide the password you were previously given under your name.",
    "nox": "I cannot see. It is too dark in here.",
    "lumos": "Could you please put out that light? It is much too bright.",
    "expelliarmus": "I cannot reply right now. I've dropped my wand.",
    "accio": "I am literally right here!",
    "alohamora": "You can't unlock my secrets that easily.",
    "expecto patronum": "Wow, what a lovely luminescent creature.",
    "obliviate": "I'm sorry, what were we talking about?",
    "stupefy": "I cannot believe you would do that to me. I am stunned.",
    "wingardium leviosa": "I feel light as a feather.",
    "avada kedavra": "I cannot believe you would do that to me. That is unforgivable.",
    "crucio": "Ahhhhh!!! The pain!!! Stop it!!! I'm just messing with you. I can't feel a thing. I'm just a hexed bit of code.",
    "imperio": "You now have a bodyless minion to do your bidding. Happy?",
    "riddikulus": "Why did the wizard go to Briarwolf?\nTo learn how to SPELL.",
    "salutem sileo": "Salutem Sileo is a premium spell for an instant cure from pixie pox, the blue plague, dragon sneezes, bouts of weightlessness, poison, unwanted love spells, and more.\nCharges will apply upon casting.\nCurrent price is Φ10.00 or .17 Wizcoin.",
    "nine broom": "Nine Broom is a sport in which two teams of nine try to score on the opponent’s three by three grid of goals.",
    "whisps": "Whisps are thirty-second shareable illusions.",
    "whisp": "Whisps are thirty-second shareable illusions.",
    "n.m.": "NM is a slang term for nonmagic humans, or humans that do not know about the existence of wizards and witches. Also known by younger generations as an NPC.",
    "NM": "NM is a slang term for nonmagic humans, or humans that do not know about the existence of wizards and witches. Also known by younger generations as an NPC.",
    "NPC": "NPC is a slang term for nonmagic humans, or humans that do not know about the existence of wizards and witches. Also known as an NM."
  };

  // Set this to the filename of an image you've added to this same GitHub
  // repo (e.g. "background.jpg") to give every visitor the same background
  // by default. Leave it "" for no default background.
  var DEFAULT_BACKGROUND = "";

  // Set this to the filename of a PNG you've added to this same GitHub repo
  // (e.g. "logo.png") to show it inside the card, above the heading.
  // Leave it "" to show no image.
  var CARD_IMAGE = "copps.png";

  // --------------------------------------------------------------------

  var els = {
    form:     document.getElementById('form'),
    keyword:  document.getElementById('keyword'),
    response: document.getElementById('response'),
    cardImage:document.getElementById('cardImage')
  };

  function norm(s) {
    return String(s || '').trim().toLowerCase();
  }

  function showResponse(text, missed) {
    els.response.innerHTML = text;
    els.response.className = 'response show' + (missed ? ' miss' : '');
  }

  function lookup(raw) {
    var key = norm(raw);
    if (!key) return;
    if (Object.prototype.hasOwnProperty.call(RESPONSES, key)) {
      showResponse(RESPONSES[key], false);
    } else {
      var known = Object.keys(RESPONSES).join(', ');
      showResponse('No response for "' + raw.trim() + '".');
    }
  }

  els.form.addEventListener('submit', function (e) {
    e.preventDefault();
    lookup(els.keyword.value);
  });

  // ---- background image ----

  if (DEFAULT_BACKGROUND) {
    document.body.style.backgroundImage = 'url(' + JSON.stringify(DEFAULT_BACKGROUND).slice(1, -1) + ')';
  }

  // ---- card image ----

  if (CARD_IMAGE) {
    els.cardImage.src = CARD_IMAGE;
    els.cardImage.hidden = false;
  }

  els.keyword.focus();
})();
</script>
</body>
</html>
